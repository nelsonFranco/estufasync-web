extension=openssl
allow_url_fopen = On
extension=pdo_mysql
extension=mysqli

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

file_uploads = On
upload_max_filesize = 2M
post_max_size = 3M
max_file_uploads = 1

